[project]
name = "sam3-cpp-tests"
version = "0.1.0"
description = "Python test utilities for sam3.cpp"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "timm>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "iopath>=0.1.10",
    "einops>=0.7",
    "opencv-python-headless>=4.9",
    "pycocotools>=2.0.11",
    "psutil>=7.2.2",
    "ftfy>=6.3.1",
    "regex>=2026.5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
